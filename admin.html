<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración del portal · Contador'ate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#f3f5f9; --surface:#ffffff; --ink:#15233a; --muted:#59667b; --line:#d8dfea;
  --brand:#12305c; --brand-ink:#eef3fa; --accent:#b97a12; --accent-soft:#f6ead2;
  --ok:#2f7a4f; --bad:#b3261e;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0d1420; --surface:#141e2e; --ink:#e6ecf5; --muted:#9caabf; --line:#26344c;
  --brand:#0a1a33; --brand-ink:#e6ecf5; --accent:#e0a640; --accent-soft:#3a2d14;
  --ok:#6cc792; --bad:#f2847b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--brand);color:var(--brand-ink)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
header b{font-family:var(--f-display);font-weight:400;font-size:20px}
header small{display:block;opacity:.75;font-size:12px}
header a,header button{color:var(--brand-ink)}
h1,h2{font-family:var(--f-display);font-weight:400}
main{padding-block:28px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,textarea,select{font:inherit;font-size:15px;padding:9px 11px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:8px}
label.check input{width:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:7px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{margin-top:22px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--muted)}
.item>div:first-child{min-width:0}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid currentColor;margin-left:6px}
.pill.off{color:var(--bad)}
.msg{min-height:22px;font-size:14px;margin-top:10px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.login{max-width:380px;margin:40px auto}
.login form{display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.item{flex-direction:column}}
</style>

<header>
  <div class="wrap">
    <div><b>Contador'ate</b><small>Administración del portal de clientes</small></div>
    <div class="row-actions"><a href="index.html">Ver portal</a><button class="btn ghost" id="salir" hidden>Cerrar sesión</button></div>
  </div>
</header>

<main class="wrap">
  <section id="vLogin" class="card login">
    <h1 style="margin-top:0;font-size:24px">Iniciar sesión</h1>
    <form id="fLogin">
      <label>Correo<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Ingresar</button>
      <div class="msg" id="lMsg" role="status"></div>
    </form>
  </section>

  <section id="vPanel" hidden>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="card">
      <h2 id="fTitle" style="margin-top:0;font-size:22px"></h2>
      <form id="fItem"><div class="grid" id="fFields"></div>
        <div class="row-actions" style="margin-top:16px">
          <button class="btn" type="submit" id="fSave">Guardar</button>
          <button class="btn ghost" type="button" id="fCancel" hidden>Cancelar edición</button>
        </div>
        <div class="msg" id="fMsg" role="status"></div>
      </form>
      <div class="list" id="list"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  "https://rddqovxastacbvhhwggv.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZHFvdnhhc3RhY2J2aGh3Z2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjQwNTgsImV4cCI6MjA5NTY0MDA1OH0.eA8WpfrGn3en4NZ-IG3j8XSynvujrExD6Bv1Lmp1fCs"
);

const ICONOS = [["invoice","Factura"],["home","Inmueble"],["chart","Gráfica"],["ship","Importación"],["calendar","Agenda"],["app","Genérico"]];
const ENT = {
  noticias:{tabla:"portal_noticias", nombre:"Noticias", singular:"noticia", orden:["fecha",false],
    campos:[
      {k:"fecha",l:"Fecha",t:"date",req:1},
      {k:"categoria",l:"Categoría",t:"text",req:1,lista:["Tributario","Exógena","Laboral","Nómina","Municipal","La firma"]},
      {k:"titulo",l:"Título",t:"text",req:1,full:1},
      {k:"resumen",l:"Resumen (lo que se ve siempre)",t:"area",req:1,full:1},
      {k:"detalle",l:"Detalle (opcional, se abre con \"Leer más\")",t:"area",full:1},
      {k:"publicada",l:"Publicada",t:"check",def:true}],
    linea:x=>[x.titulo, `${x.fecha} · ${x.categoria}`, !x.publicada]},
  apps:{tabla:"portal_apps", nombre:"Aplicaciones", singular:"aplicación", orden:["orden",true],
    campos:[
      {k:"nombre",l:"Nombre",t:"text",req:1},
      {k:"categoria",l:"Categoría",t:"text",req:1,lista:["Facturación","Arrendamientos","Financiero","Comercio exterior","Gestión","Nómina"]},
      {k:"descripcion",l:"Descripción",t:"area",req:1,full:1},
      {k:"url",l:"Enlace (vacío = Próximamente)",t:"url",full:1},
      {k:"icono",l:"Ícono",t:"select",opts:ICONOS,def:"app"},
      {k:"orden",l:"Orden",t:"number",def:10},
      {k:"activa",l:"Visible en el portal",t:"check",def:true}],
    linea:x=>[x.nombre, `${x.categoria} · ${x.url||"Próximamente"}`, !x.activa]},
  redes:{tabla:"portal_redes", nombre:"Redes sociales", singular:"red", orden:["orden",true],
    campos:[
      {k:"red",l:"Red",t:"text",req:1,lista:["WhatsApp","Facebook","Instagram","TikTok","LinkedIn","YouTube"]},
      {k:"url",l:"Enlace del perfil",t:"url",req:1},
      {k:"orden",l:"Orden",t:"number",def:10}],
    linea:x=>[x.red, x.url, false]}
};

let actual="noticias", editId=null, filas=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoy=()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10); // hora de Colombia
function msg(el,txt,ok){el.textContent=txt;el.className="msg "+(ok?"ok":"err");}

function pintarTabs(){
  $("tabs").innerHTML=Object.entries(ENT).map(([k,e])=>`<button role="tab" aria-selected="${k===actual}" data-k="${k}">${e.nombre}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{actual=b.dataset.k;editId=null;pintarTabs();pintarForm();cargar();});
}

function pintarForm(x){
  const e=ENT[actual];
  $("fTitle").textContent=(x?"Editar ":"Nueva ")+e.singular;
  $("fCancel").hidden=!x; $("fMsg").textContent="";
  $("fFields").innerHTML=e.campos.map(c=>{
    const v=x?x[c.k]:(c.t==="date"?hoy():c.def);
    const id="c_"+c.k, cls=c.full?' class="full"':"";
    if(c.t==="check") return `<label class="check${c.full?" full":""}"><input type="checkbox" id="${id}" ${v?"checked":""}>${c.l}</label>`;
    if(c.t==="area") return `<label${cls}>${c.l}<textarea id="${id}" ${c.req?"required":""}>${esc(v)}</textarea></label>`;
    if(c.t==="select") return `<label${cls}>${c.l}<select id="${id}">${c.opts.map(o=>`<option value="${o[0]}" ${o[0]===v?"selected":""}>${o[1]}</option>`).join("")}</select></label>`;
    const dl=c.lista?`<datalist id="dl_${c.k}">${c.lista.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:"";
    return `<label${cls}>${c.l}<input id="${id}" type="${c.t}" value="${esc(v??"")}" ${c.req?"required":""} ${c.lista?`list="dl_${c.k}"`:""}>${dl}</label>`;
  }).join("");
}

function leerForm(){
  const o={};
  ENT[actual].campos.forEach(c=>{
    const el=$("c_"+c.k);
    if(c.t==="check") o[c.k]=el.checked;
    else if(c.t==="number") o[c.k]=Number(el.value||0);
    else o[c.k]=el.value.trim()||null;
  });
  return o;
}

async function cargar(){
  const e=ENT[actual];
  $("list").innerHTML=`<div class="item"><span class="m">Cargando…</span></div>`;
  const {data,error}=await sb.from(e.tabla).select("*").order(e.orden[0],{ascending:e.orden[1]});
  if(error){$("list").innerHTML=`<div class="item"><span class="msg err">No se pudo leer ${e.nombre.toLowerCase()}: ${esc(error.message)}</span></div>`;return;}
  filas=data;
  $("list").innerHTML=data.length?data.map(x=>{const [t,m,off]=e.linea(x);return `<div class="item" data-id="${x.id}">
    <div><div class="t">${esc(t)}${off?'<span class="pill off">Oculta</span>':""}</div><div class="m">${esc(m)}</div></div>
    <div class="row-actions"><button class="btn ghost" data-a="edit">Editar</button><button class="btn ghost" data-a="del">Eliminar</button></div></div>`}).join("")
    :`<div class="item"><span class="m">Todavía no hay ${e.nombre.toLowerCase()}. Use el formulario para agregar la primera.</span></div>`;
  $("list").querySelectorAll(".item[data-id]").forEach(row=>{
    const x=filas.find(f=>f.id===row.dataset.id);
    row.querySelector('[data-a="edit"]').onclick=()=>{editId=x.id;pintarForm(x);scrollTo({top:0,behavior:"smooth"});};
    row.querySelector('[data-a="del"]').onclick=ev=>{
      const box=ev.target.parentElement;
      box.innerHTML=`<span class="m">¿Eliminar definitivamente?</span><button class="btn danger" data-a="si">Sí, eliminar</button><button class="btn ghost" data-a="no">No</button>`;
      box.querySelector('[data-a="no"]').onclick=cargar;
      box.querySelector('[data-a="si"]').onclick=async()=>{
        const {error}=await sb.from(e.tabla).delete().eq("id",x.id);
        if(error) msg($("fMsg"),"No se pudo eliminar: "+error.message,false); else msg($("fMsg"),"Eliminado.",true);
        cargar();
      };
    };
  });
}

$("fItem").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const e=ENT[actual], datos=leerForm();
  $("fSave").disabled=true;
  const q=editId?sb.from(e.tabla).update(datos).eq("id",editId):sb.from(e.tabla).insert(datos);
  const {error}=await q;
  $("fSave").disabled=false;
  if(error){msg($("fMsg"),"No se guardó: "+error.message+(error.code==="42501"?" (su correo no está autorizado como administrador)":""),false);return;}
  msg($("fMsg"),editId?"Cambios guardados. Ya se ven en el portal.":"Publicado. Ya se ve en el portal.",true);
  editId=null; pintarForm(); $("fMsg").textContent="Guardado. Ya se ve en el portal."; $("fMsg").className="msg ok"; cargar();
});
$("fCancel").onclick=()=>{editId=null;pintarForm();};

$("fLogin").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});
  if(error){msg($("lMsg"),"Correo o contraseña incorrectos.",false);return;}
  entrar();
});
$("salir").onclick=async()=>{await sb.auth.signOut();location.reload();};

function entrar(){$("vLogin").hidden=true;$("vPanel").hidden=false;$("salir").hidden=false;pintarTabs();pintarForm();cargar();}
sb.auth.getSession().then(({data})=>{if(data.session) entrar();});
</script>
